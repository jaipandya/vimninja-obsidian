# Publishes a release when a version tag is pushed (or by hand for an existing tag), with a GitHub artifact
# attestation for each file, so anyone (and Obsidian's community directory) can verify where they came from.
name: Release

on:
  push:
    tags: ['*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to attest and (re)upload, e.g. 1.0.0
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: The tag is the manifest's version
        run: test "$(jq -r .version manifest.json)" = "$TAG"

      - name: Attest the release files
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish (or update) the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" main.js manifest.json styles.css --clobber
          else
            gh release create "$TAG" main.js manifest.json styles.css --title "$TAG" --notes-file RELEASE_NOTES.md
          fi
